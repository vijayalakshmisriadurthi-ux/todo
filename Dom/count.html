<!DOCTYPE html>
<html>
    <body>
         
    <p id="counter">0</p>
    <button id="btn1">increment</button>
    <button id="btn2">decrement</button>
    <script>
        count=document.getElementById('count')
        button1=document.getElementById('btn1')
        button2=document.getElementById('btn2')
        button1.addEventListener("click",function(){count.textContent=Number(count.textContent)+1})
        button2.addEventListener("click",function(){count.textContent=Number(count.textContent)-1})
    </script>
    </body>
</html>
